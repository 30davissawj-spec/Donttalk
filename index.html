<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Volume Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            padding: 50px 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: 0.2s;
        }
        button.active {
            background-color: #dc3545;
        }
        .slider-box {
            margin: 30px 0;
        }
        input[type=range] {
            width: 100%;
            margin-top: 10px;
        }
        .meter {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            color: #00ffcc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔊 Volume Shusher</h2>
    <p>Set your limit. If the room gets louder than your setting, the website will tell everyone to be quiet.</p>

    <div class="meter" id="volumeDisplay">Current Volume: --</div>

    <div class="slider-box">
        <label id="thresholdLabel" style="font-weight: bold;">Trigger Limit: 50</label>
        <input type="range" id="thresholdSlider" min="5" max="100" value="50">
    </div>

    <button id="startBtn">Start Monitoring</button>
</div>

<script>
    let audioContext;
    let analyser;
    let microphone;
    let javascriptNode;
    let isMonitoring = false;
    let lastPlayedTime = 0;
    const cooldown = 3000; // 3 seconds in milliseconds

    const startBtn = document.getElementById('startBtn');
    const volumeDisplay = document.getElementById('volumeDisplay');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const thresholdLabel = document.getElementById('thresholdLabel');

    // Update threshold label when slider moves
    thresholdSlider.addEventListener('input', (e) => {
        thresholdLabel.innerText = `Trigger Limit: ${e.target.value}`;
    });

    startBtn.addEventListener('click', async () => {
        if (!isMonitoring) {
            try {
                // Request microphone access
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

                analyser.smoothingTimeConstant = 0.8;
                analyser.fftSize = 1024;

                microphone.connect(analyser);
                analyser.connect(javascriptNode);
                javascriptNode.connect(audioContext.destination);

                // Process the microphone volume data
                javascriptNode.onaudioprocess = () => {
                    const array = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(array);
                    let values = 0;

                    for (let i = 0; i < array.length; i++) {
                        values += array[i];
                    }

                    // Calculate average volume level (scaled 0-100 roughly)
                    const average = Math.round(values / array.length);
                    volumeDisplay.innerText = `Current Volume: ${average}`;

                    const currentThreshold = parseInt(thresholdSlider.value);
                    const now = Date.now();

                    // If volume exceeds threshold and cooldown has passed
                    if (average > currentThreshold && (now - lastPlayedTime > cooldown)) {
                        lastPlayedTime = now;
                        screamShutUp();
                    }
                };

                isMonitoring = true;
                startBtn.innerText = "Stop Monitoring";
                startBtn.classList.add('active');

            } catch (err) {
                alert("Microphone access denied or not supported: " + err);
            }
        } else {
            // Stop monitoring
            if (audioContext) audioContext.close();
            isMonitoring = false;
            startBtn.innerText = "Start Monitoring";
            startBtn.classList.remove('active');
            volumeDisplay.innerText = "Current Volume: --";
        }
    });

    // Uses the browser's built-in Text-to-Speech engine
    function screamShutUp() {
        const utterance = new SpeechSynthesisUtterance("Shut up!");
        utterance.volume = 1.0; // Max website volume
        utterance.rate = 1.4;   // Fast pace
        utterance.pitch = 0.5;  // Deeper, angrier tone
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
